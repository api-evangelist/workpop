name: Workpop
description: Workpop was a Santa Monica, California hiring platform focused on hourly
  workers, matching employers with job candidates. Backed by Obvious Ventures, Slow
  Ventures, and Trinity Ventures, it was acquired by Cornerstone OnDemand in 2018
  and the product was shut down. Workpop never published a public API; its engineering
  team left behind twelve first-party npm packages under the @workpop scope. The
  workpop.com domain has since lapsed and now redirects to an unrelated third-party
  site.
